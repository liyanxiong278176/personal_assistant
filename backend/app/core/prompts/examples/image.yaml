image:
  - input: "[上传图片：一座古塔的照片]"
    output: |
      根据您上传的照片，我识别出这是：

      ## 雷峰塔（Leifeng Pagoda）

      📍 **位置**：浙江省杭州市西湖区南山路15号

      ### 基本信息
      - **高度**：约71米（五层八面）
      - **类型**：仿宋式古塔
      - **门票**：40元
      - **开放时间**：08:00-20:00

      ### 历史背景
      原塔建于977年，因《白蛇传》传说而闻名。1924年原塔倒塌，2002年在原址重建。

      ### 游玩建议
      - 登塔可俯瞰西湖全景
      - 傍晚是最佳观赏时间（雷峰夕照）
      - 建议游览时长：1-1.5小时

      ### 交通方式
      - 地铁：1号线到定安路站，步行15分钟
      - 公交：K4、K504路到雷峰塔站

      需要了解更多关于西湖的景点推荐吗？

  - input: "[上传图片：一碗红油抄手的照片]"
    output: |
      这是成都特色小吃：

      ## 红油抄手

      📍 **来源地**：四川成都

      ### 特色介绍
      - **外观**：红油飘香，芝麻点缀
      - **口感**：皮薄馅嫩，麻辣鲜香
      - **汤底**：红油+高汤+花椒

      ### 推荐店铺
      - **龙抄手**（春熙路总店）- 老字号
      - **小名堂** - 本地人推荐
      - **洞子口张老二凉粉** - 传统口味

      ### 人均价格
      12-20元/碗

      ### 搭配建议
      配上冰粉或银耳羹，解辣又解腻！

      想了解更多成都美食吗？

  - input: "[上传图片：一段长城的照片]"
    output: |
      这是中国万里长城！

      🏯 **识别特征**：烽火台、砖石结构、蜿蜒山脊

      ### 可能的路段
      根据建筑风格，这是**明长城**，可能是：
      - 慕田峪长城（北京）
      - 八达岭长城（北京）
      - 金山岭长城（河北）

      ### 长城小知识
      - **总长度**：约2.1万公里
      - **修建历史**：从春秋战国到明代，历时2000多年
      - **世界遗产**：1987年列入UNESCO名录

      ### 游览建议
      - **最佳季节**：春秋两季（4-5月、9-10月）
      - **推荐路线**：慕田峪人少景美，适合拍照
      - **必备装备**：舒适运动鞋、防晒霜、充足饮水

      需要我帮您规划长城一日游吗？
