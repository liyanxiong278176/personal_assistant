budget:
  - input: "去云南旅游5天，预算3000元够吗"
    output: |
      为您分析云南5日游预算（3000元）：

      ## 预算可行性分析

      ✅ **结论：够用！** 选择昆明-大理-丽江线，3000元可以玩得不错。

      ## 费用明细

      ### 交通费（约1000元）
      - 往返机票：约800元（提前预订优惠）
      - 当地交通：约200元（高铁+公交）

      ### 住宿费（约900元）
      - 青旅床位：80元/晚 × 4 = 320元
      - 经济型酒店：150元/晚 × 4 = 600元
      - **建议**：2晚青旅+2晚酒店

      ### 餐饮费（约600元）
      - 云南米线：15-25元/碗
      - 过桥米线：30-50元
      - 土锅子：60-80元
      - 小吃：30-50元/天
      - 正餐：80-100元/天
      - **日均**：120元

      ### 门票费（约350元）

      | 景点 | 门票 |
      |------|------|
      | 滇池海埂公园 | 免费 |
      | 西山龙门 | 80元 |
      | 大理古城 | 免费 |
      | 洱海公园 | 免费 |
      | 丽江古城维护费 | 50元 |
      | 玉龙雪山（索道） | 120元 |
      | 蓝月谷 | 含在索道票内 |

      ### 其他费用（约150元）
      - 特产购买：约100元
      - 应急备用：约50元

      ## 费用总计：约3000元

      ## 省钱技巧

      1. **交通**：提前30天预订机票，省30%
      2. **住宿**：青旅拼房，认识新朋友
      3. **餐饮**：逛本地菜市场，体验烟火气
      4. **景点**：选择免费景点（古城、湖泊）

      ## 需要加预算的情况

      - 想去香格里拉（需+1000元）
      - 想住特色民宿（需+500元）
      - 想吃特色餐厅（需+300元）

      需要我帮您规划详细行程吗？

  - input: "去日本穷游7天大概多少钱"
    output: |
      为您估算日本穷游7天费用：

      ## 费用总览

      **总预算：约8000-10000元**（不含购物）

      ## 费用明细

      ### 机票（约3500-4500元）
      - 往返经济舱：3500-5000元
      - 省钱技巧：
        - 选择春秋、吉祥等廉价航空
        - 避开樱花季、红叶季
        - 提前2-3个月预订

      ### 住宿（约1800-2500元）

      | 类型 | 价格/晚 | 7晚合计 |
      |------|---------|---------|
      | 胶囊旅馆 | 200元 | 1400元 |
      | 青旅床位 | 180元 | 1260元 |
      | 商务酒店 | 350元 | 2450元 |

      **推荐**：5晚青旅+2晚商务酒店，约1800元

      ### 交通（约1000-1500元）

      - JR Pass 7日券：约1300元
      - 地铁一日券：约40元/天
      - **省钱**：只买关西或关东地区周游券

      ### 餐饮（约1200-1800元）

      | 类型 | 价格 | 次数 |
      |------|------|------|
      | 便利店饭团 | 15元 | 14次 |
      | 拉面店 | 50元 | 7次 |
      | 牛肉饭 | 40元 | 5次 |
      | 回转寿司 | 100元 | 2次 |
      | 一兰拉面 | 70元 | 2次 |

      **日均餐饮费**：约180-250元

      ### 门票（约500元）

      - 大部分神社寺庙免费或低价
      - 东京塔/晴空塔：约100元
      - 迪士尼：约400元（可选）
      - 富士山五合目：免费

      ### 通讯（约150元）

      - 7天流量卡：约100元
      - 或租用WiFi蛋：约80元

      ## 超省攻略

      1. **住宿**：胶囊旅馆体验独特又省钱
      2. **餐饮**：便利店便当好吃又便宜
      3. **交通**：多走路，少打车
      4. **购物**：唐吉诃德买日用品
      5. **门票**：利用免费公园和神社

      ## 可选花费

      - 温泉体验：+500元
      - 和服租赁：+300元
      - 相扑比赛：+400元

      需要详细规划日本穷游路线吗？

  - input: "带全家5口人去三亚5天预算多少"
    output: |
      为您估算三亚5日家庭游（5人）费用：

      ## 费用总览

      **总预算：约18000-25000元**

      ## 费用明细

      ### 机票（约8000-12000元）

      | 仓位 | 单价 | 5人合计 |
      |------|------|---------|
      | 经济舱 | 800-1600元 | 4000-8000元 |
      | 往返 | - | 8000-16000元 |

      **省钱**：避开寒假/春节，选择淡季

      ### 住宿（约5000-8000元）

      | 酒店类型 | 价格/晚 | 5晚合计 |
      |----------|---------|---------|
      | 五星级 | 1500-2000元 | 7500-10000元 |
      | 四星级 | 800-1200元 | 4000-6000元 |
      | 三星级 | 400-600元 | 2000-3000元 |

      **家庭推荐**：两间家庭房或套房

      ### 餐饮（约3000-4000元）

      | 餐厅类型 | 人均/餐 | 5人×5餐 |
      |----------|---------|---------|
      | 海鲜大餐 | 200元 | 5000元 |
      | 酒店餐厅 | 150元 | 3750元 |
      | 本地菜 | 100元 | 2500元 |
      | 小吃/简餐 | 50元 | 1250元 |

      **日均餐饮**：约600-800元

      ### 门票娱乐（约2000-3000元）

      | 景点 | 门票 | 5人合计 |
      |------|------|---------|
      | 亚龙湾 | 免费 | 0元 |
      | 天涯海角 | 81元 | 405元 |
      | 南山寺 | 129元 | 645元 |
      | 蜈支洲岛 | 168元 | 840元 |
      | 亚特兰蒂斯水世界 | 388元 | 1940元 |

      **推荐**：选2-3个付费景点即可

      ### 交通（约1000-1500元）

      - 机场接送：约200元
      - 5天租车：约800元
      - 或网约车：约1000元

      ## 费用优化建议

      ### 省钱方案（约18000元）
      - 淡季出行（机票省3000）
      - 四星酒店（省3000）
      - 部分自己做饭（省1000）

      ### 舒适方案（约25000元）
      - 五星海景酒店
      - 海鲜大餐×2
      - 蜈支洲岛+亚特兰蒂斯

      ## 儿童优惠
      - 12岁以下机票半价
      - 1.2米以下免门票
      - 酒店可加床

