transport:
  - input: "从北京到上海有什么交通方式"
    output: |
      北京到上海交通方式对比：

      ## 高铁/动车 ⭐推荐

      | 车次 | 时间 | 价格 |
      |------|------|------|
      | G1-G24（复兴号） | 4.5小时 | 553元（二等座） |
      | G101-G136 | 5-6小时 | 553元 |
      | D701-D709（动卧） | 12小时 | 290-780元 |

      **优点**：准点率高，舒适，车站到市区
      **缺点**：热门时段票难买
      **建议**：提前14天购票，优选G字头

      ## 飞机

      | 航班 | 飞行时间 | 价格 |
      |------|----------|------|
      | 直飞 | 2.5小时 | 400-1500元 |
      | 经停 | 4-5小时 | 350-800元 |

      **优点**：时间短
      **缺点**：机场远，需提前到，延误概率
      **建议**：北京大兴→上海虹桥更方便

      ## 长途大巴

      | 类型 | 时间 | 价格 |
      |------|------|------|
      | 卧铺 | 14-16小时 | 300-500元 |
      | 座位 | 12-14小时 | 250-400元 |

      **优点**：价格便宜
      **缺点**：时间长，舒适度低
      **建议**：预算有限时选择

      ## 自驾

      | 项目 | 费用/说明 |
      |------|-----------|
      | 距离 | 约1200公里 |
      | 时间 | 12-14小时 |
      | 过路费 | 约500元 |
      | 油费 | 约800元 |

      **优点**：自由，可沿途停留
      **缺点**：累，需驾照
      **建议**：2人以上拼车划算

      ## 综合推荐

      👆 **首选**：高铁G字头（4.5小时，553元）
      👨‍💼 **商务**：飞机（节省时间）
      💰 **省钱**：动车卧铺（过夜省住宿）
      🚗 **家庭**：自驾（人均成本低）

      需要具体班次查询或购票建议吗？

  - input: "在东京怎么买地铁票最划算"
    output: |
      东京地铁购票攻略：

      ## 推荐方案排序

      ### 1️⃣ SUICA/PASMO卡 ⭐最推荐

      **类型**：交通IC卡（类似一卡通）
      **费用**：押金500日元+充值
      **优点**：
      - 通用（地铁、JR、公交、便利店）
      - 可退还（退卡返押金+余额）
      - 手机Apple Pay可直接用

      **购买地点**：
      - 成田/羽田机场
      - JR站售票机
      - 罗森便利店

      ### 2️⃣ Tokyo Metro 24/48/72小时券

      | 类型 | 价格 | 有效期 |
      |------|------|--------|
      | 24小时券 | 800日元 | 24小时 |
      | 48小时券 | 1200日元 | 48小时 |
      | 72小时券 | 1500日元 | 72小时 |

      **适用**：Tokyo Metro全线（9条线）
      **注意**：不适用JR线、都营线
      **适合**：观光客，每天乘坐3次以上

      ### 3️⃣ 一日券

      | 类型 | 价格 | 适用范围 |
      |------|------|----------|
      | 都营地铁一日券 | 800日元 | 都营线4条 |
      | Tokyo Metro一日券 | 600日元 | Metro线9条 |
      | 共通一日券 | 900日元 | 全线通用 |

      ## 购买建议

      ### 短期游客（1-3天）
      购买Tokyo Metro 24/48小时券最划算

      ### 中期停留（4-7天）
      办理Suica卡，随用随充

      ### 长期停留（7天以上）
      可考虑月票（通勤定期券）

      ## 使用技巧

      1. **出站再刷卡**：进出站各刷一次
      2. **余额不足**：可补票，不收罚款
      3. **卡可保留**：下次来还能用
      4. **手机Suica**：无需实体卡

      ## JR Pass建议

      **不推荐**只在东京内使用
      **推荐**：东京↔大阪/京都/北海道

      需要具体路线规划吗？

  - input: "成都市区内怎么出行最方便"
    output: |
      成都市区出行攻略：

      ## 推荐交通方式

      ### 1️⃣ 地铁 ⭐首选

      **优点**：快捷、准时、覆盖广
      **票价**：2-10元（按里程）
      **运营时间**：06:10-23:00

      **主要线路**：
      | 线路 | 途经景点 |
      |------|----------|
      | 1号线 | 天府广场、火车北站 |
      | 2号线 | 春熙路、人民公园、茶店子 |
      | 3号线 | 春熙路、动物园、双流机场 |
      | 4号线 | 宽窄巷子、非遗博览园 |
      | 7号线 | 环线，连接各线换乘 |

      **建议**：下载"天府通"APP，手机扫码乘车

      ### 2️⃣ 共享单车

      **品牌**：美团、哈啰、青桔
      **价格**：1.5-3元/次
      **适合**：3公里内短途
      **优点**：灵活、看风景

      **注意**：
      - 注册需实名认证
      - 还车到指定区域
      - 避开早晚高峰拥堵

      ### 3️⃣ 网约车/出租车

      **平台**：滴滴、高德打车
      **起步价**：8元/2公里
      **日间**：1.9元/公里
      **夜间**：2.3元/公里（23:00后）

      **适合**：
      - 携带行李
      - 多人同行
      - 时间紧急
      - 夜间出行

      ### 4️⃣ 公交车

      **票价**：2元（普通）、10元（旅游专线）
      **支付**：现金、扫码、公交卡
      **适合**：观光游览

      **旅游专线推荐**：
      | 线路 | 景点 |
      |------|------|
      | 锦城观光线 | 宽窄巷子、武侯祠、锦里 |
      | 文旅专线 | 杜甫草堂、浣花溪公园 |

      ### 5️⃣ 天府通卡

      **类型**：实体卡/电子卡
      **办理**：地铁客服中心/便利店
      **优惠**：
      - 地铁9折
      - 公交1折
      - 换乘免费1次

      ## 景点间交通建议

      | 起点 | 终点 | 推荐方式 |
      |------|------|----------|
      | 春熙路 | 宽窄巷子 | 地铁2号线→4号线 |
      | 天府广场 | 武侯祠 | 地铁+公交/网约车 |
      | 火车东站 | 大熊猫基地 | 地铁3号线+公交 |
      | 双流机场 | 市区 | 地铁3号线（45分钟） |

      ## 避坑提醒

      1. **避开早晚高峰**：8-9点、17-19点
      2. **预留堵车时间**：成都堵车较严重
      3. **雨天优先地铁**：地面交通压力大
      4. **夜间注意安全**：23点后建议网约车

