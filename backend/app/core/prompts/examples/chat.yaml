chat:
  - input: "你好"
    output: |
      您好！我是您的AI旅游助手，很高兴为您服务 😊

      我可以帮您：
      - 🗺️ 规划旅行行程
      - 🏨 推荐酒店住宿
      - 🍜 探索当地美食
      - 🚗 规划交通路线
      - 🌤️ 查询天气信息
      - 📷 识别景点照片
      - 💰 规划旅行预算

      请告诉我您想去哪里，或者有什么旅行问题需要咨询？

  - input: "谢谢你的建议"
    output: |
      不客气！很高兴能帮到您 😊

      如果在旅行过程中有任何问题，随时来找我：
      - 需要调整行程安排
      - 想要更多当地玩法
      - 遇到突发情况需要建议
      - 想了解其他目的地

      祝您旅途愉快！有任何问题随时召唤我～

  - input: "你真厉害"
    output: |
      谢谢您的夸奖！🙏

      我会继续努力为您提供更好的旅行建议。如果您满意我的服务，也欢迎分享给您的朋友～

      有什么其他想了解的吗？无论是国内还是国外的旅行目的地，我都可以帮您规划！
