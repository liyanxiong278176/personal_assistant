food:
  - input: "重庆有什么必吃的火锅店"
    output: |
      重庆火锅必吃推荐：

      ## 老字号经典

      1. **桥头火锅（解放碑店）**
         - 人均：120元
         - 特色：中华老字号，毛肚最出名
         - 地址：渝中区解放碑步行街
         - 排队：建议下午4点前到

      2. **德庄火锅**
         - 人均：100元
         - 特色：毛底火锅，久煮不咸
         - 地址：多家连锁，南滨路店环境好

      3. **小天鹅火锅**
         - 人均：110元
         - 特色：重庆火锅发源地之一
         - 地址：洪崖洞店景观最佳

      ## 本地人推荐

      4. **洞子老火锅**
         - 人均：80元
         - 特色：防空洞里吃火锅，地道体验
         - 地址：沙坪坝区小龙坎
         - 注意：环境较简陋，味道正宗

      5. **佩姐老火锅**
         - 人均：90元
         - 特色：网红店，味道稳定
         - 地址：解放碑八一路好吃街

      ## 必点菜品

      - 毛肚 - 七上八下涮15秒
      - 鸭肠 - 爽脆Q弹
      - 酥肉 - 现炸最佳
      - 老肉片 - 肥而不腻
      - 贡菜 - 爽脆解腻

      ## 辣度选择
      - 微辣：适合外地游客
      - 中辣：有吃辣基础
      - 特辣：本地人级别

      ## 蘸料配方
      香油+蒜泥+葱花+香菜（经典搭配）

      需要推荐其他重庆美食吗？

  - input: "推荐一些平价的广州美食"
    output: |
      广州平价美食推荐：

      ## 早茶点心（人均30-60元）

      1. **陶陶居** - 老字号，虾饺皇必点
      2. **点都德** - 连锁店，性价比高
      3. **广州酒家** - 莲蓉包一绝

      ## 粥粉面（人均15-30元）

      4. **银记肠粉** - 肠粉连锁王
         - 推荐：鲜虾肠粉、牛肉肠粉
         - 人均：20元

      5. **林记粥品** - 砂锅粥专家
         - 推荐：及第粥、皮蛋瘦肉粥
         - 人均：25元

      6. **顺记冰室** - 老广州味道
         - 推荐：猪手面、云吞面
         - 人均：18元

      ## 烧腊（人均25-40元）

      7. **深井烧鹅**
         - 推荐：烧鹅濑粉
         - 人均：35元

      8. **九爷鸡**
         - 推荐：白切鸡、烧肉
         - 人均：30元

      ## 街头小吃（人均5-15元）

      9. **南信牛奶甜品专家** - 双皮奶、姜撞奶
      10. **陈添记** - 爽鱼皮、艇仔粥
      11. **开平糕点** - 鸡仔饼、杏仁饼

      ## 美食聚集地
      - 上下九步行街 - 传统小吃集中
      - 北京路 - 平价美食多
      - 西华路 - 本地人觅食地

      预算：人均50-80元/天可以吃得很满足！

  - input: "西安有什么特色的小吃街"
    output: |
      西安特色小吃街推荐：

      ## 回民街（游客必去）

      📍 **位置**：钟楼西北侧
      🕙 **营业时间**：09:00-23:00

      必吃推荐：
      - 老孙家羊肉泡馍 - 百年老店
      - 贾三灌汤包 - 皮薄汁多
      - 定家小酥肉 - 肉质鲜嫩
      - 东南亚甑糕 - 糯香甜软
      - 红红酸菜炒米 - 酸辣开胃
      - 石家包子 - 孜然牛肉包

      **人均消费**：50-80元

      ## 洒金桥（本地人推荐）

      📍 **位置**：回民街西侧
      🕙 **营业时间**：06:00-14:00（早市）

      必吃推荐：
      - 刘明柿子糊塌 - 现炸最佳
      - 马建山粉汤羊血 - 麻辣鲜香
      - 杨天玉肉夹馍 - 本地排队王
      - 老金家菜盒 - 酥脆多层

      **人均消费**：30-50元
      **优势**：价格更实惠，本地人常去

      ## 永兴坊（非遗美食）

      📍 **位置**：中山门内
      🕙 **营业时间**：10:00-22:00

      特色推荐：
      - 子长煎饼 - 延安特色
      - 陕北横山羊肉 - 无膻味
      - 柞水洋芋糍粑 - 秦岭美食
      - 宁强核桃馍 - 汉中特产

      **特色**：汇聚陕西各地美食

      ## 大皮院（隐藏宝藏）

      📍 **位置**：回民街北侧小巷

      推荐：
      - 一真楼羊肉泡馍
      - 杨家粉蒸肉
      - 花奶奶酸梅汤

      **建议**：上午去，很多店下午就关门了

      ## 游玩建议
      - 先逛洒金桥（便宜正宗）
      - 再去回民街（热闹有氛围）
      - 永兴坊适合买特产
      - 避开正餐高峰，体验更好
