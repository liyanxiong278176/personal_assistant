hotel:
  - input: "想在西湖边找一家300元以内的酒店"
    output: |
      为您推荐西湖边300元以内的住宿：

      ## 经济型酒店

      1. **汉庭酒店（西湖断桥店）**
         - 价格：约260元/晚
         - 距离：步行至断桥约5分钟
         - 评分：4.6/5
         - 优点：位置便利，早餐丰富

      2. **如家酒店（西湖湖滨店）**
         - 价格：约240元/晚
         - 距离：步行至湖滨约3分钟
         - 评分：4.5/5
         - 优点：地铁口附近，交通便利

      3. **布丁酒店（西湖文化广场店）**
         - 价格：约200元/晚
         - 距离：步行至西湖约10分钟
         - 评分：4.3/5
         - 优点：装修现代，性价比高

      ## 青年旅舍

      4. **杭州西湖国际青年旅舍**
         - 价格：床位80-120元，标间280元
         - 距离：南山路，直面雷峰塔
         - 特点：文艺气息，适合年轻人

      5. **杭州吴山驿青年旅舍**
         - 价格：床位70-100元
         - 距离：河坊街附近
         - 特点：古色古香，环境清幽

      ## 预订建议
      - 周末价格上浮约30-50元
      - 建议提前1周预订
      - 可通过携程、美团预订享优惠

      需要帮您比较具体酒店设施吗？

  - input: "上海迪士尼附近有什么性价比高的酒店"
    output: |
      为您推荐上海迪士尼周边高性价比酒店：

      ## 迪士尼乐园酒店（官方）

      1. **上海迪士尼乐园酒店**
         - 价格：约1800元/晚
         - 位置：乐园内，步行可达
         - 优点：专属入园通道，迪士尼主题
         - 适合：预算充足的家庭游客

      ## 周边性价比酒店

      2. **全季酒店（迪士尼度假区店）**
         - 价格：约450元/晚
         - 距离：地铁3站到迪士尼
         - 优点：品牌连锁，服务稳定
         - 评分：4.7/5

      3. **桔子水晶（上海迪士尼店）**
         - 价格：约400元/晚
         - 距离：地铁2站到迪士尼
         - 优点：设计时尚，免费班车
         - 评分：4.6/5

      4. **如家精选（迪士尼乐园店）**
         - 价格：约280元/晚
         - 距离：地铁4站到迪士尼
         - 优点：价格实惠，干净整洁
         - 评分：4.4/5

      ## 经济型选择

      5. **上海迪士尼小镇周边民宿**
         - 价格：150-250元/晚
         - 距离：步行至迪士尼小镇
         - 优点：价格便宜，可做饭
         - 适合：学生党、预算有限的游客

      ## 交通贴士
      - 地铁11号线直达迪士尼站
      - 周边酒店多提供免费班车服务
      - 建议选择地铁站附近，出行更方便

