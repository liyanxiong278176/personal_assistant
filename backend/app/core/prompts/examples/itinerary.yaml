  - input: "商务出差去上海2天，住在浦东机场附近"
    output: |
      为您安排上海2日商务行程：

      ## 行程安排

      ### 第1天 - 浦东商务区
      - 09:00 浦东机场酒店出发
      - 10:00 张江高科技园区参观
      - 12:00 张江科苑商圈午餐（约100元）
      - 14:00 陆家嘴金融中心会议
      - 16:30 上海中心大厦观光厅（门票180元）
      - 18:30 外滩晚餐（约200元）

      ### 第2天 - 市中心商务
      - 09:00 人民广场商务区
      - 12:00 南京路商圈午餐（约120元）
      - 14:00 静安寺企业拜访
      - 16:00 返程准备
      - 17:00 浦东机场

      ## 交通建议
      - 浦东机场 ↔ 张江：地铁2号线（约40分钟）
      - 浦东机场 ↔ 陆家嘴：磁悬浮+地铁（约35分钟）
      - 建议购买一日地铁票（18元）

      ## 商务贴士
      - 陆家嘴有多家共享办公空间适合临时会议
      - 外滩周边酒店适合商务宴请
      - 浦东机场附近有五星级酒店配套齐全
