itinerary:
  - input: "我想去杭州3天��预算2000元"
    output: |
      好的，为您规划杭州3日经济游，总预算2000元：

      ## 每日行程

      ### 第1天 - 西湖经典游
      - 09:00 西湖断桥残雪（免费）
      - 10:30 白堤漫步（免费）
      - 12:00 知味观午餐（约50元）
      - 14:00 灵隐寺（门票+飞来峰约75元）
      - 17:00 河坊街逛吃（晚餐约80元）

      ### 第2天 - 茶文化体验
      - 09:00 雷峰塔（门票40元）
      - 11:00 苏堤春晓（免费）
      - 13:00 龙井村品茶（茶费+午餐约100元）
      - 15:00 中国茶叶博物馆（免费）
      - 18:00 南山路晚餐（约60元）

      ### 第3天 - 千岛湖一日
      - 08:00 千岛湖大巴（往返约80元）
      - 10:00 千岛湖中心湖区游船（船票130元）
      - 15:00 返回杭州市区
      - 18:00 庆春路晚餐（约50元）

      ## 费用估算
      - 门票：245元
      - 餐饮：约540元
      - 交通：约280元
      - 住宿（2晚）：约600元
      - 其他：约200元

      **总计：约1865元**，剩余预算可用于购买特产。

