query:
  - input: "西湖有哪些必去的景点"
    output: |
      西湖必游景点推荐：

      ## 西湖十景（经典必游）

      1. **断桥残雪** - 白娘子传说发源地，免费
      2. **雷峰夕照** - 雷峰塔，门票40元
      3. **曲院风荷** - 夏季赏荷最佳地，免费
      4. **平湖秋月** - 中秋赏月胜地，免费
      5. **柳浪闻莺** - 春天柳絮飞舞，免费
      6. **花港观鱼** - 红鱼池喂鱼，免费
      7. **双峰插云** - 南北高峰远眺
      8. **三潭印月** - 需乘船登岛，门票55元
      9. **苏堤春晓** - 晨跑散步绝佳，免费
      10. **南屏晚钟** - 净慈寺，门票10元

      ## 周边推荐

      - **灵隐寺** - 江南著名古刹，门票75元
      - **飞来峰** - 石窟造像，含在灵隐寺门票内
      - **西溪湿地** - 城市湿地，门票80元
      - **宋城** - 大型演出《宋城千古情》，门票280元起

      ## 游玩建议

      - 最佳时间：3-5月（春季）、9-11月（秋季）
      - 游览方式：环湖骑行（约2小时）、游船（约1.5小时）
      - 免费景点占比：约70%

  - input: "成都这周末天气怎么样"
    output: |
      为您查询成都本周末天气：

      ## 4月16日（周六）
      - 天气：多云转阴
      - 气温：18°C - 25°C
      - 风力：东南风2级
      - 降水概率：20%
      - 紫外线：中等

      ## 4月17日（周日）
      - 天气：阴转小雨
      - 气温：17°C - 23°C
      - 风力：东北风3级
      - 降水概率：60%
      - 紫外线：弱

      ## 出行建议

      - 周六适合户外活动，可安排游览锦里、宽窄巷子
      - 周日有小雨，建议室内活动如博物馆、茶馆
      - 穿搭：薄外套+长袖，备雨具
      - 空气质量：良（AQI约75）

      *数据来源：和风天气API，更新于今日14:00*

  - input: "西安有哪些好吃的特色美食"
    output: |
      西安必吃美食推荐：

      ## 肉夹馍系列

      1. **子午路张记肉夹馍** - 老字号，酥脆多汁
      2. **樊记腊汁肉夹馍** - 百年老店
      3. **秦豫肉夹馍** - 本地人推荐

      ## 面食系列

      4. **柳巷面** - 手工扯面，筋道弹牙
      5. **BIANGBIANG面** - 宽面拌油泼辣子
      6. **岐山臊子面** - 酸辣鲜香

      ## 小吃系列

      7. **回民街羊肉泡馍** - 需自己掰馍体验
      8. **定家小酥肉** - 肉质鲜嫩
      9. **东南亚甑糕** - 糯香甜软
      10. **柿子饼** - 临潼特产

      ## 美食聚集地

      - **回民街** - 游客必去，小吃集中
      - **永兴坊** - 陕西各地美食汇聚
      - **洒金桥** - 本地人常去，价格实惠

      ## 人均消费参考

      - 肉夹馍：15-25元/个
      - 泡馍：35-50元/碗
      - 面食：15-30元/碗
