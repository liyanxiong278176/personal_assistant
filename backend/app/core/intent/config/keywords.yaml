# Keywords Configuration for Intent Classification
# Supports hot-reload via mtime detection
#
# Structure:
#   keywords:
#     <intent>:
#       positive:  # 加分关键词
#         <keyword>: <weight>
#       negative:  # 扣分关键词（排除规则）
#         <keyword>: <penalty>
#   patterns:
#     <intent>:
#       - <regex_pattern>

keywords:
  # ============================================================================
  # 行程规划意图 (itinerary)
  # ============================================================================
  itinerary:
    positive:
      # Strong indicators (0.65 each) - Core intent words
      规划: 0.65
      行程: 0.65
      路线: 0.65
      制定: 0.65
      安排: 0.65
      计划: 0.65
      # Compound strong indicators (0.7 each)
      三日游: 0.7
      五日游: 0.7
      两日游: 0.7
      一日游: 0.7
      日游: 0.55
      # City + 游 patterns (0.6 each)
      上海游: 0.65
      北京游: 0.65
      游: 0.45
      # Medium indicators (0.4 each)
      旅游: 0.4
      旅行: 0.4
      几天: 0.4
      玩: 0.4
      定制: 0.4
      设计: 0.4
      去哪: 0.4
      豪华游: 0.5
      文化之旅: 0.5
      度假: 0.4
      # Weak indicators (0.2 each)
      去: 0.2
      天: 0.2
      想: 0.2
      地方: 0.2
    negative:
      # 排除：当出现这些词时，扣分表示非行程意图
      聊聊: -0.3
      谈谈: -0.3
      说说: -0.3

  # ============================================================================
  # 信息查询意图 (query)
  # ============================================================================
  query:
    positive:
      # Strong indicators - Weather (0.65 each)
      天气: 0.65
      温度: 0.65
      下雨: 0.65
      雨: 0.65
      伞: 0.65
      # Strong indicators - Info (0.65 each)
      门票: 0.65
      价格: 0.65
      开放时间: 0.65
      # Medium indicators - Weather (0.4 each)
      太阳: 0.4
      晴: 0.4
      热: 0.4
      冷: 0.4
      风力: 0.4
      穿衣: 0.4
      温差: 0.4
      气温: 0.4
      # Medium indicators - Info (0.4 each)
      怎么去: 0.4
      交通: 0.4
      地址: 0.4
      查询: 0.4
      # Weak indicators
      怎么样: 0.3
      如何: 0.3
      景点: 0.25
      好玩: 0.3
      推荐: 0.3
      好地方: 0.3
      那边: 0.25
      有啥: 0.3
    negative:
      # 排除："天气真好想去玩"这类语境中天气非查询意图
      真好: -0.2
      去玩: -0.3
      好棒: -0.2

  # ============================================================================
  # 普通对话意图 (chat)
  # ============================================================================
  chat:
    positive:
      # Greetings (0.4 each)
      你好: 0.4
      您好: 0.4
      在吗: 0.4
      在不在: 0.4
      # Thanks (0.3 each)
      谢谢: 0.3
      感谢: 0.3
      多谢: 0.3
      # Casual (0.25 each)
      哈哈: 0.25
      帮忙: 0.25
      有人吗: 0.25
      # Time greetings (0.35 each)
      嗨: 0.35
      晚上好: 0.35
      早上好: 0.35
      下午好: 0.35
    negative: {}

  # ============================================================================
  # 图片识别意图 (image)
  # ============================================================================
  image:
    positive:
      图片: 0.5
      照片: 0.5
      识别: 0.5
    negative: {}

  # ============================================================================
  # 酒店预订意图 (hotel)
  # ============================================================================
  hotel:
    positive:
      # Strong indicators (0.6 each)
      酒店: 0.6
      住宿: 0.6
      # Medium indicators
      民宿: 0.4
      宾馆: 0.4
      # Compound phrases
      住哪里: 0.5
      住的地方: 0.45
      # Medium indicators
      旅舍: 0.35
      招待所: 0.35
      旅馆: 0.35
      青旅: 0.35
      # Weak indicators
      住: 0.25
      房间: 0.2
      入住: 0.35
      歇脚: 0.3
    negative:
      # 排除："聊聊酒店"非预订意图
      聊聊: -0.3
      谈谈: -0.3

  # ============================================================================
  # 美食推荐意图 (food)
  # ============================================================================
  food:
    positive:
      # Strong indicators (0.65 each)
      美食: 0.65
      小吃: 0.65
      # Medium indicators
      餐厅: 0.45
      # Compound phrases
      有什么好吃的: 0.65
      好吃的: 0.5
      吃啥: 0.5
      推荐一下: 0.6
      # Medium indicators
      菜: 0.4
      吃: 0.3
      好吃: 0.3
      特色菜: 0.45
      # Weak indicators
      当地美食: 0.4
      菜系: 0.3
    negative: {}

  # ============================================================================
  # 预算规划意图 (budget)
  # ============================================================================
  budget:
    positive:
      # Strong indicators (0.65 each)
      预算: 0.65
      多少钱: 0.65
      贵: 0.65
      便宜: 0.5
      # Medium indicators
      花费: 0.45
      # Compound phrases
      大概多少钱: 0.6
      人均: 0.5
      价位: 0.45
      # Medium indicators
      费用: 0.4
      # Weak indicators
      总预算: 0.45
      省钱: 0.35
      花销: 0.4
    negative: {}

  # ============================================================================
  # 交通出行意图 (transport)
  # ============================================================================
  transport:
    positive:
      # Strong indicators (0.65 each)
      交通: 0.65
      怎么走: 0.6
      # Medium indicators - lowered "怎么去" to avoid overriding query intent
      怎么去: 0.45
      # Medium indicators
      飞机: 0.4
      高铁: 0.4
      开车: 0.35
      自驾: 0.35
      # Compound phrases
      坐什么车: 0.5
      # Weak indicators
      出行: 0.3
      交通工具: 0.4
    negative: {}

# ============================================================================
# 意图正则模式 (用于增强识别)
# ============================================================================
patterns:
  itinerary:
    - "去.{2,6}?玩"           # "去北京玩"
    - "去.{2,6}?旅游"         # "去云南旅游"
    - ".{2,6}?[三两五六七八九十]?日游"  # "北京3天游", "两日游"
    - ".{2,6}?几天游"         # "北京几天游"
    - "制定.{2,10}游"         # "制定北京游"
    - "规划.{2,10}游"         # "规划云南游"
    - "设计.{2,10}游"         # "设计文化游"
    - "安排.{2,10}游"         # "安排上海游"
    - ".{2,6}天假"            # "5天假"
    - "周末.{2,6}"            # "周末计划"
    - "帮我.{2,10}"           # "帮我规划..."

  query:
    # Weather patterns
    - ".{2,6}?会.*下雨"       # "上海会下雨吗"
    - ".{2,6}?明天.*雨"       # "杭州明天有雨吗"
    - ".{2,6}?需要.*伞"       # "杭州需要带伞吗"
    - ".{2,6}?有.*太阳"       # "重庆有太阳吗"
    - ".{2,6}热.*热"          # "成都热不热"
    - ".{2,6}冷.*冷"          # "哈尔滨冷不冷"
    - ".{2,6}穿衣.*建议"      # "西安穿衣建议"
    - ".{2,6}风力.*多大"      # "苏州风力多大"
    - ".{2,6}天气"            # "西湖天气"
    - "下雨吗"                # "下雨吗"
    - "需要带伞吗"            # "需要带伞吗"
    - "有太阳吗"              # "有太阳吗"
    - "热不热"                # "热不热"
    - "风力多大"              # "风力多大"
    - "穿衣建议"              # "穿衣建议"
    # Info patterns
    - ".{2,6}门票"            # "故宫门票"
    - ".{2,6}价格"            # "景点价格"
    - ".{2,6}开放时间"        # "景点开放时间"
    - ".{2,6}好玩吗"          # "那里好玩吗"
    - ".{2,6}怎么样"          # "那边怎么样"

  hotel:
    - ".{2,6}?住哪里"         # "北京住哪里"
    - ".{2,6}?住宿推荐"       # "上海住宿推荐"
    - "住的地方"              # "住的地方"
    - "找个歇脚处"            # "找个歇脚处"
    - ".{2,6}住宿"            # "北京住宿"

  food:
    - ".{2,6}?有什么好吃的"   # "成都有什么好吃的"
    - ".{2,6}?美食推荐"       # "重庆美食推荐"
    - ".{2,6}有啥特色菜"      # "有啥特色菜"
    - "当地美食"              # "当地美食"
    - ".{2,6}好吃的"          # "北京好吃的"
    - "吃啥"                  # "吃啥"
    - "好吃吗"                # "好吃吗"

  budget:
    - ".{2,6}?大概多少钱"     # "去北京大概多少钱"
    - ".{2,6}?预算多少"       # "5天预算多少"
    - ".{2,6}人均.{2,4}"      # "人均多少"
    - "总预算"                # "总预算"
    - "省钱"                  # "省钱"
    - "花销"                  # "花销"

  transport:
    - ".{2,6}?怎么去"         # "北京怎么去"
    - "如何去.{2,6}"          # "如何去上海"
    - ".{2,6}怎么走"          # "怎么走"
    - "坐什么车"              # "坐什么车"
    - ".{2,6}出行"            # "北京出行"
    - "交通工具"              # "交通工具"

  chat:
    - "^(你好|您好|嗨|hi|hello)"  # Greetings
    - "(在吗|在不在|有人吗)"      # Availability check
    - "(谢谢|感谢|多谢)"          # Thanks
    - "^(哈哈|嘿嘿|呵呵)"         # Laughter
    - "(晚上好|早上好|下午好)"    # Time-based greetings

# ============================================================================
# 配置说明
# ============================================================================
#
# 权重范围说明:
# - Strong (0.5-0.7): 核心意图指示词
# - Medium (0.35-0.45): 语境相关指示词
# - Weak (0.2-0.3): 辅助词
#
# 负向关键词 (negative):
# - 用于处理语义冲突的 Bad Case
# - 例如 "天气真好想去北京玩" 中的 "天气" 非查询意图
# - 命中负向词时扣分，分数不允许为负
#
# 热更新:
# - 修改此文件后自动生效（mtime 检测）
# - 无需重启服务